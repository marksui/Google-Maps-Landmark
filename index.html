<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Maps Miniatures Landmark Map</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Landmark filters and list">
        <header class="brand">
          <div class="brand-title">
            <p class="eyebrow">Google Maps Miniatures</p>
            <div class="title-row">
              <h1 id="appTitle">Landmark Map</h1>
              <button
                id="mapHelp"
                class="help-button"
                type="button"
                aria-expanded="false"
                aria-describedby="mapHelpPopover"
                title="说明"
              >
                <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                <span id="mapHelpText" class="sr-only">说明</span>
              </button>
            </div>
            <div id="mapHelpPopover" class="help-popover" role="tooltip">
              <strong id="mapHelpTitle">说明</strong>
              <span id="mapHelpBody"></span>
            </div>
          </div>
          <div class="brand-actions">
            <button
              id="toggleSidebar"
              class="icon-button"
              type="button"
              title="收起面板"
              aria-controls="sidebar"
              aria-expanded="true"
            >
              <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
              <span id="toggleSidebarText" class="sr-only">收起面板</span>
            </button>
            <button id="fitVisible" class="icon-button" type="button" title="显示当前结果">
              <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
              <span id="fitVisibleText" class="sr-only">显示当前结果</span>
            </button>
          </div>
        </header>

        <section class="stats" id="statsSection" aria-label="Map statistics">
          <div>
            <strong id="visibleCount">0</strong>
            <span id="visibleCountLabel">地标</span>
          </div>
          <div>
            <strong id="cityCount">0</strong>
            <span id="cityCountLabel">城市</span>
          </div>
          <div>
            <strong id="countryCount">0</strong>
            <span id="countryCountLabel">国家/地区</span>
          </div>
        </section>

        <section class="controls" id="controlsSection" aria-label="Filters">
          <label class="field">
            <span id="languageLabel">语言</span>
            <select id="languageSelect"></select>
          </label>

          <label class="field">
            <span id="mapProviderLabel">地图来源</span>
            <select id="mapProviderSelect"></select>
          </label>

          <label class="field">
            <span id="viewModeLabel">视图</span>
            <select id="viewModeSelect"></select>
          </label>

          <label class="field search-field">
            <span id="searchLabel">搜索</span>
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="searchInput" type="search" placeholder="城市、国家、地标名称" />
          </label>

          <div class="filter-grid">
            <label class="field">
              <span id="continentLabel">洲</span>
              <select id="continentFilter"></select>
            </label>
            <label class="field">
              <span id="countryLabel">国家/地区</span>
              <select id="countryFilter"></select>
            </label>
            <label class="field wide">
              <span id="categoryLabel">图标类型</span>
              <select id="categoryFilter"></select>
            </label>
          </div>

          <div class="button-row">
            <button id="resetFilters" class="secondary-button" type="button">
              <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
              <span id="resetFiltersText">重置</span>
            </button>
            <button
              id="toggleList"
              class="secondary-button"
              type="button"
              aria-controls="landmarkList"
              aria-expanded="false"
            >
              <i class="fa-solid fa-list" aria-hidden="true"></i>
              <span id="toggleListText">列表</span>
            </button>
          </div>
        </section>

        <section class="map-note" id="mapNote" aria-label="Map note">
          <h2 id="mapNoteTitle">说明</h2>
          <p id="mapNoteBody"></p>
        </section>

        <section class="legend" id="legend" aria-label="Icon legend"></section>
        <section class="landmark-list collapsed" id="landmarkList" aria-label="Landmarks" tabindex="-1"></section>
      </aside>

      <section class="map-pane" id="mapPane" aria-label="Map">
        <button
          id="restoreSidebar"
          class="sidebar-restore"
          type="button"
          title="显示面板"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <i class="fa-solid fa-sliders" aria-hidden="true"></i>
          <span id="restoreSidebarText" class="sr-only">显示面板</span>
        </button>
        <div id="apiKeyPanel" class="api-key-panel">
          <form id="apiKeyForm" class="api-key-card">
            <label class="field">
              <span id="apiKeyLabel">Google Maps API key</span>
              <input id="apiKeyInput" type="password" autocomplete="off" placeholder="AIza..." />
            </label>
            <button class="primary-button" type="submit">
              <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
              <span id="apiKeyButtonText">加载官方地图</span>
            </button>
            <p id="apiKeyStatus">key 只保存在本机浏览器。</p>
          </form>
        </div>
        <div id="map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="landmark-media.js"></script>
    <script src="app.js"></script>
  </body>
</html>
